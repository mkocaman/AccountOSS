<!DOCTYPE html>
<html>
<head>
  <title>Clear Cache</title>
</head>
<body>
  <h1>Clearing Browser Cache...</h1>
  <div id="status">Please wait...</div>
  
  <script>
    (async () => {
      const status = document.getElementById('status');
      
      // Unregister all service workers
      if ('serviceWorker' in navigator) {
        const registrations = await navigator.serviceWorker.getRegistrations();
        for (let registration of registrations) {
          await registration.unregister();
          status.innerHTML += '<br>✅ Unregistered service worker';
        }
      }
      
      // Clear all caches
      if ('caches' in window) {
        const cacheNames = await caches.keys();
        for (let name of cacheNames) {
          await caches.delete(name);
          status.innerHTML += '<br>✅ Deleted cache: ' + name;
        }
      }
      
      // Clear storage
      localStorage.clear();
      sessionStorage.clear();
      status.innerHTML += '<br>✅ Cleared localStorage';
      status.innerHTML += '<br>✅ Cleared sessionStorage';
      
      status.innerHTML += '<br><br><strong>✅ ALL CACHES CLEARED!</strong>';
      status.innerHTML += '<br><br>Redirecting to home in 3 seconds...';
      
      setTimeout(() => {
        window.location.href = '/';
      }, 3000);
    })();
  </script>
</body>
</html>
