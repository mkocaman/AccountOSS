<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>AccountOS Icon Generator</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        button { padding: 10px 20px; background: #1890ff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #096dd9; }
        .downloads { margin-top: 20px; }
        .download-link { display: block; margin: 10px 0; padding: 10px; background: #f5f5f5; border-radius: 4px; text-decoration: none; color: #333; }
    </style>
</head>
<body>
    <h2>AccountOS Icon Generator</h2>
    <p>Bu sayfa AccountOS için PWA icon'larını oluşturur.</p>
    <button onclick="generateIcons()">Generate Icons</button>
    <div id="downloads" class="downloads"></div>

    <script>
        function generateIcons() {
            const sizes = [72, 96, 128, 144, 152, 192, 384, 512];
            const downloads = document.getElementById('downloads');
            downloads.innerHTML = '<h3>Generated Icons:</h3>';

            sizes.forEach(size => {
                const canvas = document.createElement('canvas');
                canvas.width = size;
                canvas.height = size;
                const ctx = canvas.getContext('2d');

                // Gradient background
                const gradient = ctx.createLinearGradient(0, 0, size, size);
                gradient.addColorStop(0, '#1890ff');
                gradient.addColorStop(1, '#096dd9');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, size, size);

                // White border
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = size * 0.02;
                ctx.strokeRect(size * 0.1, size * 0.1, size * 0.8, size * 0.8);

                // White text
                ctx.fillStyle = '#ffffff';
                ctx.font = `bold ${size * 0.25}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('AOS', size / 2, size / 2);

                // Download link
                canvas.toBlob(blob => {
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = `icon-${size}x${size}.png`;
                    link.textContent = `Download ${size}x${size} Icon`;
                    link.className = 'download-link';
                    downloads.appendChild(link);
                });
            });
        }
    </script>
</body>
</html>
