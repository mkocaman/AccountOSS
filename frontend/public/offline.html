<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - AccountOS</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      background: #f0f2f5;
      text-align: center;
    }

    .offline-icon {
      font-size: 64px;
      margin-bottom: 20px;
    }

    h1 {
      color: #262626;
      margin-bottom: 10px;
    }

    p {
      color: #8c8c8c;
      margin-bottom: 20px;
    }

    button {
      background: #1890ff;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
    }

    button:hover {
      background: #40a9ff;
    }
  </style>
</head>
<body>
  <div class="offline-icon">📡</div>
  <h1>İnternet Bağlantısı Yok</h1>
  <p>Lütfen internet bağlantınızı kontrol edin ve tekrar deneyin.</p>
  <button onclick="window.location.reload()">Tekrar Dene</button>
</body>
</html>
